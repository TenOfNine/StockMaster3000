# StockMaster 3000 – Stack für Portainer (Stacks → Add stack → Web editor oder Repository).
# Keine lokalen Dateien nötig: Images kommen aus der Registry, Geheimnisse aus den
# Umgebungsvariablen des Stacks. Anleitung: webui/PORTAINER.md
#
# Pflicht-Variablen (Portainer: "Environment variables"): SM_HOSTNAME, SPIEL_REPO,
# POSTGRES_ADMIN_PASSWORD, POSTGRES_APP_PASSWORD, SM_SCHLUESSEL – siehe webui/deploy/portainer/stack.env.example
name: stockmaster

x-haertung: &haertung
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  proxy:
    <<: *haertung
    image: "${SM_IMAGE_PREFIX:-ghcr.io/tenofnine/stockmaster3000}-proxy:${SM_IMAGE_TAG:-latest}"
    ports:
      - "${SM_HTTPS_PORT:-443}:8443"
      - "${SM_HTTP_PORT:-80}:8080"
    environment:
      SM_HOSTNAME: "${SM_HOSTNAME:?SM_HOSTNAME fehlt (z. B. stockmaster.local)}"
      SM_ZUSAETZLICHE_NETZE: "${SM_ZUSAETZLICHE_NETZE:-127.0.0.1/32}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    networks: [edge, app]
    depends_on:
      - api   # startet mit; bis die API bereit ist, antwortet Caddy mit 502 statt den Stack abzubrechen
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://localhost:8443/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources: { limits: { cpus: "0.50", memory: 256M } }

  api:
    <<: *haertung
    image: "${SM_IMAGE_PREFIX:-ghcr.io/tenofnine/stockmaster3000}-api:${SM_IMAGE_TAG:-latest}"
    environment:
      SM_DATENBANK_URL: "postgresql+psycopg://stockmaster:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD fehlt}@db:5432/stockmaster"
      SM_SCHLUESSEL: "${SM_SCHLUESSEL:?SM_SCHLUESSEL fehlt (openssl rand -base64 32)}"
      SM_REPO_PFAD: /repo
      SM_COOKIE_SICHER: "true"
    volumes:
      # Absoluter Host-Pfad des Spiel-Repositorys (nur lesend).
      - "${SPIEL_REPO:?SPIEL_REPO fehlt (absoluter Pfad auf dem Docker-Host)}:/repo:ro"
    read_only: true
    tmpfs: [/tmp]
    networks: [app, data]
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources: { limits: { cpus: "1.0", memory: 512M } }

  db:
    <<: *haertung
    image: "${SM_IMAGE_PREFIX:-ghcr.io/tenofnine/stockmaster3000}-db:${SM_IMAGE_TAG:-latest}"
    # Postgres braucht beim Start einige Rechte für Dateirechte und Benutzerwechsel.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD fehlt}"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD fehlt}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      # Über TCP prüfen: Während der Erstinitialisierung läuft ein temporärer Server nur über den
      # Unix-Socket und würde sonst schon als "bereit" gelten, obwohl die API ihn nicht erreicht.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d stockmaster"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources: { limits: { cpus: "1.0", memory: 512M } }

networks:
  edge: {}
  app: { internal: true }
  data: { internal: true }

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
