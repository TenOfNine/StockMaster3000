[project]
name = "stockmaster-webui"
version = "0.1.0"
description = "Web-UI für das StockMaster-3000-Börsenexperiment (Stufe 1: lesend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=43",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pandas>=2.0",
    # Werkzeuge in tools/ (der Worker ruft sie mit diesem Python auf)
    "yfinance>=0.2.40",
    "feedparser>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["S101", "S603", "S607", "B008"]
