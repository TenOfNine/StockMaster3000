name: Prüfung

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefung:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken (vollständige Historie für die Nur-Anhängen-Prüfung)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Tests (ohne Netzwerk, Kursdaten gemockt)
        run: python -m pytest -q

      # Das Repository enthält keinen Spielstand: pruefe.py läuft gegen ein frisch initialisiertes
      # Datenverzeichnis und gegen ein mit Demo-Buchungen befülltes (eigenes lokales Git, ohne Remote).
      - name: Prüfskript auf frisch initialisiertem Datenverzeichnis
        run: |
          python tools/datenverzeichnis.py einrichten --ziel "$RUNNER_TEMP/daten-leer"
          STOCKMASTER_DATA_DIR="$RUNNER_TEMP/daten-leer" python tools/pruefe.py --historie

      - name: Prüfskript auf Datenverzeichnis mit Demo-Buchungen
        run: |
          python webui/demo/demo_daten.py --ziel "$RUNNER_TEMP/daten-demo" --tage 60 --ende 2026-09-30
          STOCKMASTER_DATA_DIR="$RUNNER_TEMP/daten-demo" python tools/pruefe.py --historie

      - name: Kein Spielstand im Repository
        run: |
          for pfad in portfolios trades data journal reviews strategie news lessons.md ranking.md session.lock spiel.json; do
            if git ls-files --error-unmatch "$pfad" >/dev/null 2>&1; then echo "Spielstand im Repository: $pfad"; exit 1; fi
          done

  webui-backend:
    name: Web-UI Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Abhängigkeiten (gesperrt)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check stockmaster tests alembic
      - name: Tests (Demo-Repository, ohne Netzwerk)
        run: uv run pytest -q

  webui-frontend:
    name: Web-UI Frontend und E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/frontend/pnpm-lock.yaml
      - name: Abhängigkeiten (gesperrt)
        run: pnpm install --frozen-lockfile
      - name: Typprüfung
        run: pnpm lint
      - name: Komponententests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Backend-Abhängigkeiten für E2E
        working-directory: webui/backend
        run: uv sync --frozen
      - name: Playwright-Browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E-Tests
        run: pnpm e2e

  webui-docker:
    name: Web-UI Docker-Rauchtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stack bauen, starten und prüfen
        run: bash webui/deploy/rauchtest.sh
