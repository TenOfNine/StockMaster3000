# StockMaster 3000 (lokaler Bau). Start: siehe webui/BETRIEB.md
#   cp .env.example .env && docker compose up -d --build
# Der Stack ist autark: Spielstand (/data), App-Konfiguration mit Secrets (/data-app) und Datenbank
# liegen in Volumes; Einstellungen und Secrets pflegt ein Admin in der App (Einrichtung).
name: stockmaster

x-haertung: &haertung
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-app-bau: &app-bau
  context: .
  dockerfile: webui/deploy/api.Dockerfile
  args: { REGISTRY: "${REGISTRY:-docker.io/library}" }

x-app-umgebung: &app-umgebung
  TZ: "${TZ:-Europe/Berlin}"
  SM_DATENBANK_HOST: db
  SM_DATENBANK_PASSWORT_DATEI: /geheim/db_app_passwort
  SM_COOKIE_SICHER: "true"
  # Nur für die einmalige Übernahme aus älteren Installationen; danach entfernen (siehe Einrichtung).
  SM_SCHLUESSEL: "${SM_SCHLUESSEL:-}"
  CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
  FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
  TWELVEDATA_API_KEY: "${TWELVEDATA_API_KEY:-}"

x-app-volumes: &app-volumes
  - daten:/data
  - app_daten:/data-app
  - geheim:/geheim:ro

services:
  proxy:
    <<: *haertung
    build:
      context: .
      dockerfile: webui/deploy/proxy.Dockerfile
      args: { REGISTRY: "${REGISTRY:-docker.io/library}" }
    image: stockmaster-proxy:lokal
    ports:
      - "${SM_HTTPS_PORT:-443}:8443"
      - "${SM_HTTP_PORT:-80}:8080"
    environment:
      SM_HOSTNAME: "${SM_HOSTNAME:-stockmaster.local}"
      SM_ZUSAETZLICHE_NETZE: "${SM_ZUSAETZLICHE_NETZE:-127.0.0.1/32}"
      SM_ZUSAETZLICHE_HOSTS: "${SM_ZUSAETZLICHE_HOSTS:-}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    networks: [edge, app]
    depends_on:
      - api   # startet mit; bis die API bereit ist, antwortet Caddy mit 502 statt den Stack abzubrechen
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://localhost:8443/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources: { limits: { cpus: "0.50", memory: 256M } }

  api:
    <<: *haertung
    build: *app-bau
    image: stockmaster-api:lokal
    environment: *app-umgebung
    volumes: *app-volumes
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    # Kein Internet: nur Proxy und Datenbank. Abrufe und Claude-Läufe erledigt der worker.
    networks: [app, data]
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources: { limits: { cpus: "1.0", memory: 768M } }

  worker:
    <<: *haertung
    build: *app-bau
    image: stockmaster-api:lokal
    command: ["python", "-m", "stockmaster", "worker"]
    environment: *app-umgebung
    volumes: *app-volumes
    read_only: true
    # Claude Code braucht Platz für HOME und Konfiguration je Lauf (wird danach gelöscht).
    tmpfs: ["/tmp:size=1g"]
    networks: [data, aus]
    depends_on:
      api: { condition: service_healthy }   # API legt Datenverzeichnis und Master-Schlüssel an
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/data-app/zustand/worker.json'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 180 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources: { limits: { cpus: "2.0", memory: 2G } }

  db:
    <<: *haertung
    build:
      context: .
      dockerfile: webui/deploy/db.Dockerfile
      args: { REGISTRY: "${REGISTRY:-docker.io/library}" }
    image: stockmaster-db:lokal
    # Postgres braucht beim Start einige Rechte für Dateirechte und Benutzerwechsel.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: postgres
      # Nur für die einmalige Übernahme aus älteren Installationen; sonst erzeugt der Container die Passwörter.
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:-}"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:-}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - geheim:/geheim
    networks: [data]
    healthcheck:
      # Gesund erst, wenn sich die Anwendungsrolle mit dem aktuellen Passwort per TCP anmelden kann
      # (nicht schon während der Erstinitialisierung über den Unix-Socket).
      test: ["CMD-SHELL", "PGPASSWORD=\"$$(cat /geheim/db_app_passwort)\" psql -h 127.0.0.1 -U stockmaster -d stockmaster -tAc 'select 1' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources: { limits: { cpus: "1.0", memory: 512M } }

networks:
  edge: {}
  app: { internal: true }
  data: { internal: true }
  # Nur der worker hat Internetzugang (Kurse, News, Claude).
  aus: {}

volumes:
  daten: {}
  app_daten: {}
  geheim: {}
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
