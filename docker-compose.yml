# StockMaster 3000 Web-UI (Stufe 1, lesend). Start: siehe webui/BETRIEB.md
#   bash webui/deploy/einrichten.sh && docker compose up -d --build
name: stockmaster

x-haertung: &haertung
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  proxy:
    <<: *haertung
    build:
      context: .
      dockerfile: webui/deploy/proxy.Dockerfile
      args: { REGISTRY: "${REGISTRY:-docker.io/library}" }
    image: stockmaster-proxy:lokal
    ports:
      - "${SM_HTTPS_PORT:-443}:8443"
      - "${SM_HTTP_PORT:-80}:8080"
    environment:
      SM_HOSTNAME: "${SM_HOSTNAME:-stockmaster.local}"
      SM_ZUSAETZLICHE_NETZE: "${SM_ZUSAETZLICHE_NETZE:-127.0.0.1/32}"
      SM_ZUSAETZLICHE_HOSTS: "${SM_ZUSAETZLICHE_HOSTS:-}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    networks: [edge, app]
    depends_on:
      - api   # startet mit; bis die API bereit ist, antwortet Caddy mit 502 statt den Stack abzubrechen
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://localhost:8443/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources: { limits: { cpus: "0.50", memory: 256M } }

  api:
    <<: *haertung
    build:
      context: .
      dockerfile: webui/deploy/api.Dockerfile
      args: { REGISTRY: "${REGISTRY:-docker.io/library}" }
    image: stockmaster-api:lokal
    environment:
      SM_DATENBANK_URL_DATEI: /run/secrets/datenbank_url
      SM_SCHLUESSEL_DATEI: /run/secrets/sm_schluessel
      SM_REPO_PFAD: /repo
      SM_COOKIE_SICHER: "true"
    secrets: [datenbank_url, sm_schluessel]
    volumes:
      - "${SPIEL_REPO:-.}:/repo:ro"
    read_only: true
    tmpfs: [/tmp]
    networks: [app, data]
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources: { limits: { cpus: "1.0", memory: 512M } }

  db:
    <<: *haertung
    image: "${REGISTRY:-docker.io/library}/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea"
    # Postgres braucht beim Start einige Rechte für Dateirechte und Benutzerwechsel.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_passwort
    secrets: [db_admin_passwort, db_app_passwort]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./webui/deploy/db-init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      # Über TCP prüfen: Während der Erstinitialisierung läuft ein temporärer Server nur über den
      # Unix-Socket und würde sonst schon als "bereit" gelten, obwohl die API ihn nicht erreicht.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d stockmaster"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources: { limits: { cpus: "1.0", memory: 512M } }

networks:
  edge: {}
  app: { internal: true }
  data: { internal: true }

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}

secrets:
  datenbank_url: { file: ./secrets/datenbank_url }
  sm_schluessel: { file: ./secrets/sm_schluessel }
  db_admin_passwort: { file: ./secrets/db_admin_passwort }
  db_app_passwort: { file: ./secrets/db_app_passwort }
